[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-bot"
version = "0.1.0"
description = "my-bot"
readme = "README.md"
requires-python = ">=3.9, <4.0"
dependencies = [
    "aiohttp",
    "img2pdf>=0.5.1,<0.7",
    "jmcomic==2.7.4",
    "nonebot2[fastapi]>=2.4,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "nonebot-plugin-apscheduler",
    "openai>=1.0,<3",
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.12,<1"
]

[tool.setuptools]
packages = []

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["nonebot_plugin_status", "nonebot_plugin_fortune", "nonebot_plugin_whateat_pic", "nonebot_plugin_animeres", "nonebot_plugin_fakemsg"]
plugin_dirs = ['my-bot/plugins']
builtin_plugins = ["echo"]
